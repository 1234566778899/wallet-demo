<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Tarjeta El Filo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111113">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--accent:#0071e3;--danger:#d70015;--gold:#c9a227}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#2c2c2e;--accent:#0a84ff;--danger:#ff453a;--gold:#e0b83a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.hidden{display:none!important}
main{max-width:420px;margin:0 auto;padding:32px 16px 48px}
.brand{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:20px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;text-align:center}
.sub{color:var(--muted);margin:0 0 24px;text-align:center}
.card{background:var(--card);border-radius:16px;padding:22px;border:1px solid var(--line)}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input.f{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input.f:focus{border-color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;text-align:center;text-decoration:none;margin-top:20px}
.btn:disabled{opacity:.5}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:10px;text-align:center}

.pass{border-radius:18px;padding:20px;color:#f5f5f7;background:linear-gradient(145deg,#2b2b2e,#111113);box-shadow:0 14px 40px rgba(0,0,0,.22)}
.pass .top{display:flex;justify-content:space-between;align-items:flex-start}
.pass small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.pass .name{font-size:22px;font-weight:600;margin-top:2px}
.pass .count{font-size:22px;font-weight:600;text-align:right}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0 4px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px solid #48484a;display:grid;place-items:center;font-size:17px}
.stamp.on{border:0;background:#f5f5f7;color:#111}
.stamp.gift{border-color:var(--gold);color:var(--gold)}
.stamp.gift.on{background:var(--gold);color:#111}
.msg{text-align:center;color:#a1a1a6;font-size:14px;margin-top:12px}
.msg.full{color:var(--gold);font-weight:600}
.qr{background:#fff;padding:12px;border-radius:12px;width:max-content;margin:18px auto 6px}
.code{text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#d1d1d6}

.wallet{display:flex;align-items:center;justify-content:center;gap:10px;background:#000;color:#fff;border:1px solid #3a3a3c;border-radius:12px;padding:12px;margin-top:20px;text-decoration:none;font-weight:600}
.wallet svg{width:30px;height:22px}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:12px}
.link{display:block;text-align:center;color:var(--accent);margin-top:18px;font-size:14px;background:none;border:0;cursor:pointer;width:100%}
</style>
</head>
<body>
<main>
  <div class="brand">💈 Barbería El Filo</div>

  <!-- Registro -->
  <section id="signup" class="hidden">
    <h1>Tu tarjeta de cortes</h1>
    <p class="sub">Junta 10 sellos y tu siguiente corte es gratis.</p>
    <form class="card" id="form">
      <label>Nombre</label><input class="f" id="nombre" autocomplete="name" required>
      <label>Teléfono (opcional)</label><input class="f" id="tel" type="tel" autocomplete="tel">
      <button class="btn" id="go">Crear mi tarjeta</button>
      <div class="err" id="err"></div>
    </form>
  </section>

  <!-- Tarjeta -->
  <section id="card" class="hidden">
    <div class="pass">
      <div class="top">
        <div><small>Cliente</small><div class="name" id="cName"></div></div>
        <div><small style="text-align:right">Sellos</small><div class="count" id="cCount"></div></div>
      </div>
      <div class="stamps" id="stamps"></div>
      <div class="msg" id="cMsg"></div>
      <div class="qr" id="qr"></div>
      <div class="code" id="cCode"></div>
    </div>
    <a class="wallet hidden" id="walletBtn" href="#">
      <svg viewBox="0 0 30 22" aria-hidden="true"><rect x="1" y="1" width="28" height="20" rx="4" fill="#fff"/><rect x="1" y="5" width="28" height="4" fill="#ff9f0a"/><rect x="1" y="9" width="28" height="4" fill="#30d158"/><rect x="1" y="13" width="28" height="4" fill="#0a84ff"/></svg>
      Agregar a Apple Wallet
    </a>
    <p class="note" id="walletNote">Abre esta página en Safari desde tu iPhone para agregarla a Wallet.</p>
    <p class="note">Muestra el QR al barbero cada vez que te cortes el pelo.</p>
    <button class="link" id="forget">¿No eres tú? Crear otra tarjeta</button>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://edwpsahpqdlbiqrelyfm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_filexaTBjLAbgRGNwscrEg_CLvIyh8_';
const META = 10;
const $ = s => document.querySelector(s);
const store = { get(){ try{ return localStorage.getItem('elfilo_token'); }catch{ return null; } }, set(v){ try{ v ? localStorage.setItem('elfilo_token', v) : localStorage.removeItem('elfilo_token'); }catch{} } };

async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(args) });
  const data = await r.json().catch(()=>null);
  if (!r.ok) throw new Error(data?.message || 'Algo salió mal');
  return data;
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMac = /Macintosh/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|CriOS|Firefox/.test(navigator.userAgent);

async function showCard(token){
  let c;
  try { [c] = await rpc('tarjeta_por_token', { p_token: token }); } catch {}
  if (!c){ store.set(null); history.replaceState(null,'','/tarjeta'); return showSignup(); }
  store.set(token);
  if (new URLSearchParams(location.search).get('t') !== token) history.replaceState(null,'',`/tarjeta?t=${token}`);
  const n = Math.min(c.sellos, META);
  $('#cName').textContent = c.nombre;
  $('#cCount').textContent = `${n}/${META}`;
  $('#cCode').textContent = c.codigo;
  $('#stamps').innerHTML = Array.from({length:META}, (_,i) => {
    const on = i < n, gift = i === META-1;
    return `<div class="stamp ${on?'on':''} ${gift?'gift':''}">${gift?'★':(on?'✓':'')}</div>`;
  }).join('');
  const msg = $('#cMsg');
  msg.textContent = n >= META ? '¡Tu próximo corte es gratis!' : `Te faltan ${META-n} para tu corte gratis`;
  msg.classList.toggle('full', n >= META);
  $('#qr').innerHTML = '';
  new QRCode($('#qr'), { text:c.codigo, width:170, height:170, correctLevel:QRCode.CorrectLevel.M });
  $('#walletBtn').href = `/api/pass?t=${token}`;
  $('#walletBtn').classList.toggle('hidden', !(isIOS || isMac));
  $('#walletNote').classList.toggle('hidden', isIOS || isMac);
  $('#signup').classList.add('hidden'); $('#card').classList.remove('hidden');
}
function showSignup(){ $('#card').classList.add('hidden'); $('#signup').classList.remove('hidden'); }

$('#form').onsubmit = async e => {
  e.preventDefault(); $('#err').textContent = ''; $('#go').disabled = true;
  try { await showCard(await rpc('registrar_cliente', { p_nombre:$('#nombre').value, p_telefono:$('#tel').value })); }
  catch (err) { $('#err').textContent = err.message; }
  $('#go').disabled = false;
};
$('#forget').onclick = () => { store.set(null); history.replaceState(null,'','/tarjeta'); showSignup(); };

const t = new URLSearchParams(location.search).get('t') || store.get();
t ? showCard(t) : showSignup();
</script>
</body>
</html>
